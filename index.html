<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>logo!-Quizze</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6fb;
    color: #1a1a2e;
  }
  h1 {
    font-size: 1.5rem;
    text-align: center;
    margin: 8px 0 24px;
  }
  ul {
    list-style: none;
    margin: 0 auto;
    padding: 0;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  li a {
    display: block;
    background: #fff;
    border-radius: 14px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border: 2px solid transparent;
  }
  li:first-child a {
    border-color: #4a6fe3;
  }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    color: #fff;
    background: #4a6fe3;
    border-radius: 999px;
    padding: 2px 10px;
    margin-bottom: 8px;
    letter-spacing: 0.03em;
  }
  .date {
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 4px;
  }
  .title {
    font-size: 1.05rem;
    font-weight: 600;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #14141f; color: #f0f0f5; }
    li a { background: #1f1f2e; box-shadow: none; }
    .date { color: #a0a0b0; }
  }
</style>
</head>
<body>
  <h1>logo!-Quizze</h1>
  <ul>
    <li>
      <a href="2026-09-20/">
        <span class="badge">Neu</span>
        <div class="date">Sonntag, 20. September 2026 — Sondersendung</div>
        <div class="title">Wahl in Mecklenburg-Vorpommern</div>
      </a>
    </li>
    <li>
      <a href="2026-09-19/">
        <div class="date">Samstag, 19. September 2026</div>
        <div class="title">logo! Nachrichten</div>
      </a>
    </li>
  </ul>
</body>
</html>
